
<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare - BestMarket</title>
    <link rel="stylesheet" href="../CSS/form_styles.css">
</head>

<body>

    <header>
        <h1>Autentificare utilizator</h1>
        <nav>
            <a href="register.html">Înregistrare</a>
        </nav>
    </header>
    <br>

    <main>
        <section>
            <h2>Autentificare</h2>
            <form name="loginForm" action="../index.html">
                <fieldset>
                    <legend><strong>Autentificare date</strong></legend>

                    <p>
                        <label>Nume utilizator:</label>
                        <input type="text" name="log_user" required>
                    </p>

                    <p>
                        <label>Parola:</label>
                        <input type="password" name="log_pass" required>
                    </p>

                    <p>
                        <input type="submit" value="Autentifică-te">
                    </p>
                </fieldset>
            </form>
        </section>
    </main>
</body>

</html>
